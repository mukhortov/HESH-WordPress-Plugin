name: CI

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the run for its previous commit.
# Pushes to master each get their own group, so none is cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Changes to documentation and design files alone (Markdown, mockups/,
  # assets/_old/) skip the checks below. They still report, as skipped, so a
  # pull request that requires them can be merged; a workflow left out with
  # paths-ignore would keep them pending.
  #
  # A push to master skips them too when a pull request already passed CI with
  # exactly the same files: its head has the same tree as the merged commit.
  changes:
    name: Code changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          # the whole pull request, so that a later change to the docs alone
          # can't show passing checks over code that failed them
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          code=true
          if [ "$EVENT" = push ]; then
            tree=$(git rev-parse "$HEAD^{tree}")
            for pr in $(gh api "repos/$REPO/commits/$HEAD/pulls" --jq '.[].number' || true); do
              head=$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha) || continue
              git fetch --quiet --no-tags origin "refs/pull/$pr/head" || continue
              [ "$(git rev-parse "$head^{tree}" 2>/dev/null)" = "$tree" ] || continue
              passed=$(gh api "repos/$REPO/actions/runs?head_sha=$head&event=pull_request&status=success" \
                --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml")] | length') || continue
              if [ "${passed:-0}" -gt 0 ]; then
                echo "Pull request #$pr passed CI with the same files at $head"
                echo "code=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
          fi
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            # both paths of a moved file: moving code into mockups/ removes code
            files=$(git diff --no-renames --name-only "$BASE...$HEAD")
            if [ -n "$files" ] && ! grep -qvE '(\.md$|^mockups/|^assets/_old/)' <<< "$files"; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Code changed: $code"

  checks:
    name: Lint, types and unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: html-editor-syntax-highlighter
          path: dist/html-editor-syntax-highlighter

  e2e:
    name: End-to-end tests (WordPress Playground)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run package
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: test-results

  plugin-check:
    name: Plugin Check
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run package
      - uses: WordPress/plugin-check-action@v1
        with:
          build-dir: dist/html-editor-syntax-highlighter
